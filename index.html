<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Exchange — Market</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand">EXCHANGE</div>
  <nav><a>Markets</a><a>Trade</a><a>Assets</a><a>Orders</a></nav>
  <div class="actions"><button class="outline">Masuk</button><button>Daftar</button></div>
</header>
<main>
  <section class="ticker" id="ticker"></section>
  <div class="layout">
    <section class="panel market">
      <div class="marketbar">
        <div><strong id="pairTitle">BTC/IDR</strong><span class="muted"> Bitcoin</span></div>
        <div class="tabs"><b>Chart</b><span>Order Book</span><span>Trades</span></div>
      </div>
      <div class="chart"><div class="grid"><canvas id="chart"></canvas></div></div>
      <div class="book">
        <div><h3>Jual</h3><table id="asks"></table></div>
        <div><h3>Beli</h3><table id="bids"></table></div>
      </div>
    </section>
    <aside>
      <section class="panel">
        <h3>Trading</h3>
        <div class="order">
          <div class="balance"><span class="muted">Saldo demo</span><br><strong>Rp 10.000.000</strong></div>
          <div class="switch"><button class="buy active">Beli</button><button class="sell">Jual</button></div>
          <label>Harga (IDR)</label><input id="price" placeholder="Harga">
          <label>Jumlah BTC</label><input placeholder="Jumlah">
          <label>Total (IDR)</label><input placeholder="Total">
          <button class="wide" id="demoOrder">Buat Order Demo</button>
          <p class="note">Mode demo. Tidak ada transaksi nyata.</p>
        </div>
      </section>
      <section class="panel marketlist"><h3>Market</h3>
        <div class="row"><b>BTC/IDR</b><span id="btcSmall">-</span></div>
        <div class="row"><b>ETH/IDR</b><span id="ethSmall">-</span></div>
        <div class="row"><b>USDT/IDR</b><span id="usdtSmall">-</span></div>
      </section>
    </aside>
  </div>
</main>
<footer>Exchange demo • Data market publik • Transaksi hanya simulasi</footer>
<script src="script.js"></script>
</body></html>
